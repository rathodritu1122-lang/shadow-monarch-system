name: Build Shadow System APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip -o Shadow_System_Android_Project.zip -d extracted

      - name: Build APK
        run: |
          gradle -p extracted/ShadowSystemAndroidProject assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shadow-System-APK
          path: extracted/ShadowSystemAndroidProject/app/build/outputs/apk/debug/*.apk
